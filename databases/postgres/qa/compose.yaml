name: db-moneipe-qa

services:
  postgres:
    image: postgres:16-alpine
    container_name: db-moneipe-postgres-qa
    restart: unless-stopped
    labels:
      app.kubernetes.io/part-of: moneipe
      app.kubernetes.io/component: database
      app.kubernetes.io/environment: qa
    environment:
      POSTGRES_USER: moneipe_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the qa env file}
      POSTGRES_DB: postgres
    ports:
      - "10.42.0.1:5433:5432"
    volumes:
      - db-moneipe-qa-data:/var/lib/postgresql/data
    networks:
      - db-moneipe-qa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-moneipe-qa-data:
    name: db-moneipe-qa-data

networks:
  db-moneipe-qa:
    name: db-moneipe-qa
    driver: bridge

name: db-moneipe-prd

services:
  postgres:
    image: postgres:16-alpine
    container_name: db-moneipe-postgres-prd
    restart: unless-stopped
    labels:
      app.kubernetes.io/part-of: moneipe
      app.kubernetes.io/component: database
      app.kubernetes.io/environment: prd
    environment:
      POSTGRES_USER: moneipe_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the prd env file}
      POSTGRES_DB: postgres
    ports:
      - "10.42.0.1:5434:5432"
    volumes:
      - db-moneipe-prd-data:/var/lib/postgresql/data
    networks:
      - db-moneipe-prd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-moneipe-prd-data:
    name: db-moneipe-prd-data

networks:
  db-moneipe-prd:
    name: db-moneipe-prd
    driver: bridge

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-control-gastos
  namespace: moneipe-dev
  labels:
    app.kubernetes.io/part-of: moneipe
    app.kubernetes.io/component: gastos
    app.kubernetes.io/environment: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: ms-control-gastos }
  template:
    metadata:
      labels: { app: ms-control-gastos }
    spec:
      containers:
        - name: ms-control-gastos
          image: ghcr.io/huansha13/moneipe-ms-control-gastos:dev # {"$imagepolicy": "flux-system:ms-control-gastos"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: DB_HOST
              value: "10.42.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "moneipe_gastos_dev"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: moneipe-gastos-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moneipe-gastos-db
                  key: DB_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              value: "https://auth-moneipe-k3-dev.huansha.win/realms/moneipe-dev"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ms-control-gastos
  namespace: moneipe-dev
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: ms-control-gastos

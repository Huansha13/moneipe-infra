apiVersion: v1
kind: Service
metadata:
  name: mongo-moneipe
  namespace: moneipe-dev
  labels:
    app.kubernetes.io/part-of: moneipe
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mongo-moneipe
  namespace: moneipe-dev
  labels:
    app.kubernetes.io/part-of: moneipe
    app.kubernetes.io/component: database
subsets:
  - addresses:
      - ip: 10.42.0.1
    ports:
      - port: 27017
        protocol: TCP

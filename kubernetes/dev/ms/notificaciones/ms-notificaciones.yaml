apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-notificaciones
  namespace: moneipe-dev
  labels:
    app.kubernetes.io/part-of: moneipe
    app.kubernetes.io/component: notificaciones
    app.kubernetes.io/environment: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: ms-notificaciones }
  template:
    metadata:
      annotations:
        moneipe.dev/mongo-uri-revision: "2"
      labels: { app: ms-notificaciones }
    spec:
      containers:
        - name: ms-notificaciones
          image: ghcr.io/huansha13/moneipe-ms-notificaciones:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: moneipe-notificaciones-mongo
                  key: MONGO_URI
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ms-notificaciones
  namespace: moneipe-dev
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: ms-notificaciones

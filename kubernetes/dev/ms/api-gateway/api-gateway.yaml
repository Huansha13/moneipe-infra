apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: moneipe-dev
  labels:
    app.kubernetes.io/part-of: moneipe
    app.kubernetes.io/component: gateway
    app.kubernetes.io/environment: dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/huansha13/moneipe-ms-api-gateway:dev # {"$imagepolicy": "flux-system:api-gateway"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: KEYCLOAK_ISSUER_URI
              value: "https://auth-moneipe-k3-dev.huansha.win/realms/moneipe-dev"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:4200,https://moneipe.vercel.app"   # ajusta origen real del front
            - name: MS_CONTROL_GASTOS_URI
              value: "http://ms-control-gastos.moneipe-dev.svc:8081"
            - name: MS_INVERSIONES_URI
              value: "http://ms-inversiones.moneipe-dev.svc:8082"
            - name: MS_NOTIFICACIONES_URI
              value: "http://ms-notificaciones.moneipe-dev.svc:8083"
            - name: MS_USUARIOS_URI
              value: "http://ms-usuarios.moneipe-dev.svc:8084"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: moneipe-dev
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: moneipe-dev
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: api-moneipe-k3-dev.huansha.win
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config-cli
  labels:
    app.kubernetes.io/name: keycloak-config-cli
    app.kubernetes.io/part-of: moneipe
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-config-cli
        app.kubernetes.io/part-of: moneipe
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: import-realm
          image: quay.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
          imagePullPolicy: IfNotPresent
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak.moneipe-keycloak.svc.cluster.local:8080
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-config-cli-admin
                  key: KEYCLOAK_USER
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-config-cli-admin
                  key: KEYCLOAK_PASSWORD
            - name: IMPORT_FILES_LOCATIONS
              value: /config/realm.json
            - name: IMPORT_MANAGED_CLIENT
              value: no-delete
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: realm-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-config-cli-realm
            items:
              - key: realm.json
                path: realm.json
